name: Reorganize method-first layout

on:
  push:
    branches:
      - chore/method-first-notebook-layout
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply repository migration
        run: python tools/_repo_reorg_once.py

      - name: Compile source
        run: python -m compileall -q src

      - name: Commit migration on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .cursor/rules \
            .gitignore \
            README.md \
            code \
            docs \
            notebooks \
            plan \
            results \
            src/nn_compression/utils/paths.py \
            tests/test_paths.py \
            tools/regen_notebook_cell_ids.py
          git commit -m "chore: reorganize notebooks by compression method [skip ci]"
          git push origin HEAD

      - name: Smoke-test representative Notebook save paths
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("src").resolve()))
          from nn_compression.utils.paths import find_project_root, get_experiment_dirs

          cases = {
              "notebooks/10_svd/10_mnist_mlp/02_rank_accuracy_tradeoff_corrected.ipynb": "10_mnist_mlp",
              "notebooks/10_svd/20_fashion_mnist_mlp/03_mlp_svd_finetuning_using_src_corrected.ipynb": "20_fashion_mnist_mlp",
              "notebooks/10_svd/30_fashion_mnist_cnn/04_cnn_conv_svd_corrected.ipynb": "30_fashion_mnist_cnn",
              "notebooks/10_svd/40_cifar10_cnn/02_svd_global_compression_using_src_corrected.ipynb": "40_cifar10_cnn",
          }

          def read_setting(source: str, name: str) -> str:
              match = re.search(rf'(?m)^\s*{name}\s*=\s*["\']([^"\']+)["\']', source)
              if not match:
                  raise AssertionError(f"missing {name}")
              return match.group(1)

          project_root = find_project_root(Path.cwd())
          for notebook_path, expected_case in cases.items():
              notebook = json.loads(Path(notebook_path).read_text(encoding="utf-8"))
              source = "\n".join(
                  "".join(cell.get("source", []))
                  for cell in notebook["cells"]
                  if cell.get("cell_type") == "code"
              )
              method_name = read_setting(source, "METHOD_NAME")
              case_name = read_setting(source, "CASE_NAME")
              experiment_name = read_setting(source, "EXPERIMENT_NAME")

              assert method_name == "10_svd"
              assert case_name == expected_case
              _, models_dir, results_dir = get_experiment_dirs(
                  project_root,
                  method_name,
                  case_name,
                  experiment_name,
                  create=False,
              )
              assert results_dir.parts[-3:] == ("10_svd", expected_case, experiment_name)
              assert models_dir.parts[-3:] == ("10_svd", expected_case, experiment_name)
              print("smoke ok:", notebook_path)
          PY
