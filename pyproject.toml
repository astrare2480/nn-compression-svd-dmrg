[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-compression-svd-dmrg"
version = "0.1.0"
description = "SVD-based neural network compression experiments"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nn_compression*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
